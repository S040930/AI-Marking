# Alembic 配置文件

[alembic]
# 迁移脚本目录
script_location = alembic

# 模板包含的时区
# timezone =

# 模板输出最大长度
# file_template = %%(rev)s_%%(slug)s

# SQLAlchemy URL 由 env.py 从 settings 注入,此处留空
sqlalchemy.url =

# 追加到 sys.path 的路径(如有需要)
# prepend_sys_path = .

# 版本表名
# version_table = alembic_version

# 版本路径
# version_locations = %(here)s/bar:%(here)s/bat:./foo

[post_write_hooks]
# 在此可配置 ruff/black 钩子

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
