[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-marking-backend"
version = "0.1.0"
description = "AI 作业批改系统后端"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.138.2",
    "uvicorn[standard]==0.49.0",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "aiofiles==25.1.0",
    "XlsxWriter==3.2.9",
    "langgraph==1.2.16",
    "langchain-core==1.6.12",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary,pool]==3.3.6",
]

[dependency-groups]
dev = [
    "ruff==0.15.20",
    "black==26.5.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "langgraph-checkpoint-sqlite==3.1.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
# 应用而非库：代码始终从 backend/ 源码目录导入，不需要构建/安装 wheel。
# 这同时避开 setuptools editable_wheel 在部分环境下的 EEXIST 构建缺陷。
package = false

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
